# Each top-level block creates an isolated UAP rule binding its principal(s) ONLY to its host(s).
# Principals in one block do NOT get access to hosts in other blocks.

agent-1-private:
  description: Allow Agent 1 (or project 755577630695 agents) to egress to private VPC endpoints
  effect: ALLOW
  principals:
    - principalSet://agents.global.org-469335481292.system.id.goog/attribute.platformContainer/aiplatform/projects/755577630695
    - principal://agents.global.org-469335481292.system.id.goog/resources/aiplatform/projects/755577630695/locations/us-east4/reasoningEngines/5763151769639059456
  hosts:
    - aiplatform.googleapis.com
    - aiplatform.mtls.googleapis.com
    - us-east4-aiplatform.googleapis.com
    - us-east4-aiplatform.mtls.googleapis.com
    - aiplatform.us-east4.rep.googleapis.com
    - aiplatform.us.rep.googleapis.com
    - logging.googleapis.com
    - logging.mtls.googleapis.com
    - internal.cloud.dinesh.com

